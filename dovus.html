<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7c2d12" />
  <title>Street Arena — Savaşçı vs Sigara Canavarı</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      overflow-x: hidden;
      touch-action: none;
    }

    .arcade-shell {
      width: 100%;
      max-width: 980px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ÜST BAR */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.78rem;
    }

    .nav-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .nav-btn:active { transform: scale(0.96); }

    .arcade-title {
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #fbbf24;
      text-shadow: 0 2px 0 #991b1b;
      font-size: 0.86rem;
    }

    /* STREET FIGHTER SAHNE */
    .sf-stage {
      position: relative;
      width: 100%;
      height: 52vh;
      min-height: 330px;
      max-height: 460px;
      border-radius: 14px;
      overflow: hidden;
      border: 3px solid #f59e0b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 0 30px rgba(0, 0, 0, 0.35);
      background: #1e1b4b;
    }

    .stage-bg-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* STREET FIGHTER ÜST CAN BARLARI */
    .sf-hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }

    .fighter-hud {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .fighter-hud.right { align-items: flex-end; }

    .fighter-label {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fef08a;
      text-shadow: 1px 2px 0 #000;
      padding: 0 3px;
    }

    .hp-outer {
      width: 100%;
      height: 18px;
      background: #450a0a;
      border: 2.5px solid #ffffff;
      border-radius: 4px;
      box-shadow: 0 3px 0 #000;
      overflow: hidden;
      position: relative;
    }

    .hp-outer.left { transform: skewX(-14deg); }
    .hp-outer.right { transform: skewX(14deg); }

    .hp-fill-left {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      background: linear-gradient(180deg, #fef08a 0%, #facc15 45%, #ca8a04 100%);
      transition: width 0.16s ease-out;
    }

    .hp-fill-right {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      background: linear-gradient(180deg, #fef08a 0%, #facc15 45%, #ca8a04 100%);
      transition: width 0.16s ease-out;
    }

    .hp-fill-left.danger, .hp-fill-right.danger {
      background: linear-gradient(180deg, #fca5a5 0%, #ef4444 50%, #991b1b 100%);
    }

    .ko-badge {
      background: linear-gradient(180deg, #dc2626 0%, #7f1d1d 100%);
      color: #fef08a;
      border: 2.5px solid #fde047;
      border-radius: 8px;
      padding: 3px 9px;
      font-weight: 900;
      font-size: 0.92rem;
      letter-spacing: 0.05em;
      text-shadow: 1px 2px 0 #000;
      box-shadow: 0 3px 0 #000;
      text-align: center;
      line-height: 1.1;
    }

    .ko-timer {
      display: block;
      font-size: 0.72rem;
      color: #ffffff;
    }

    /* KOMBO & KONUŞMA BALONLARI */
    .combo-banner {
      position: absolute;
      top: 56px;
      left: 14px;
      z-index: 22;
      font-size: 1.05rem;
      font-weight: 900;
      font-style: italic;
      color: #fde047;
      text-shadow: 2px 2px 0 #b91c1c, -1px -1px 0 #000;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.18s ease;
      pointer-events: none;
    }

    .combo-banner.show {
      opacity: 1;
      transform: scale(1);
    }

    .arcade-quote {
      position: absolute;
      top: 54px;
      right: 14px;
      max-width: 55%;
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid #f59e0b;
      color: #fef3c7;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.68rem;
      font-weight: 700;
      z-index: 21;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .arcade-quote.show { opacity: 1; }

    /* KARAKTERLER & FİZİK KATMANI */
    .arena-entities {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .entity-box {
      position: absolute;
      bottom: 24px;
      width: 155px;
      height: 195px;
      transform-origin: 50% 96%;
      will-change: transform, left;
    }

    @media (max-width: 600px) {
      .entity-box {
        width: 132px;
        height: 168px;
        bottom: 20px;
      }
      .sf-stage {
        height: 46vh;
        min-height: 295px;
      }
    }

    .entity-shadow {
      position: absolute;
      bottom: 20px;
      width: 105px;
      height: 14px;
      background: rgba(0, 0, 0, 0.48);
      border-radius: 50%;
      transform: translateX(-50%);
      z-index: 6;
    }

    .char-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.45));
    }

    .guard-aura {
      position: absolute;
      right: -6px;
      top: 22%;
      width: 44px;
      height: 56%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.65) 0%, rgba(2, 132, 199, 0.1) 75%);
      border: 2px solid #7dd3fc;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .guard-aura.active { opacity: 1; }

    .smoke-projectile {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e2e8f0 0%, #64748b 55%, #1e293b 100%);
      border: 2px solid #a855f7;
      box-shadow: 0 0 12px #a855f7;
      z-index: 15;
    }

    .hit-spark {
      position: absolute;
      font-size: 0.85rem;
      font-weight: 900;
      color: #ffffff;
      background: #ef4444;
      border: 2px solid #fde047;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      z-index: 25;
      pointer-events: none;
      animation: popUp 0.65s ease-out forwards;
    }

    .hit-spark.block { background: #0284c7; border-color: #bae6fd; }
    .hit-spark.fatal { background: linear-gradient(135deg, #b91c1c, #f59e0b); font-size: 1rem; }

    @keyframes popUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      35% { opacity: 1; transform: translate(-50%, -18px) scale(1.18); }
      100% { opacity: 0; transform: translate(-50%, -36px) scale(0.95); }
    }

    /* K.O. / ROUND SONU EKRANI */
    .round-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.72);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .round-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .round-result-text {
      font-size: 2rem;
      font-weight: 900;
      color: #fde047;
      text-shadow: 0 4px 0 #b91c1c, 0 0 20px rgba(250, 204, 21, 0.8);
      letter-spacing: 0.06em;
      text-align: center;
    }

    .rematch-btn {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      color: #1e1b4b;
      border: 2px solid #fef08a;
      border-radius: 10px;
      padding: 9px 20px;
      font-size: 0.9rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #78350f;
    }

    /* ALT ARCADE KONTROL PANELİ */
    .controls-deck {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 10px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    /* YÖN TUŞLARI (D-PAD) */
    .dpad-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(3, 48px);
      gap: 5px;
    }

    @media (max-width: 480px) {
      .dpad-grid {
        grid-template-columns: repeat(3, 46px);
        grid-template-rows: repeat(3, 42px);
      }
    }

    .dpad-btn {
      background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
      color: #f8fafc;
      border: 2px solid #64748b;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #020617;
      line-height: 1;
    }

    .dpad-btn span {
      font-size: 0.52rem;
      color: #cbd5e1;
      margin-top: 2px;
      font-weight: 700;
    }

    .dpad-btn.pressed, .dpad-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #020617;
      background: #0284c7;
      border-color: #7dd3fc;
    }

    .dpad-center {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 50%;
      margin: 8px;
    }

    /* 4 SKILL TUŞU */
    .skills-zone {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .skill-btn {
      position: relative;
      border: 2.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 10px 8px;
      color: #ffffff;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.65);
      overflow: hidden;
      transition: transform 0.08s ease;
    }

    .skill-btn:active, .skill-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.65);
    }

    .skill-btn .ico { font-size: 1.35rem; line-height: 1; }
    .skill-btn .lbl { font-size: 0.78rem; letter-spacing: 0.03em; text-transform: uppercase; }
    .skill-btn .dmg { font-size: 0.62rem; opacity: 0.9; font-weight: 700; }
    .skill-btn .key-hint {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 0.58rem;
      background: rgba(0, 0, 0, 0.45);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .btn-punch { background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); }
    .btn-kick  { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); }
    .btn-head  { background: linear-gradient(180deg, #10b981 0%, #047857 100%); }
    .btn-sword { background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%); border-color: #fde047; }

    .cd-mask {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.68);
      transform-origin: bottom;
      transform: scaleY(0);
      pointer-events: none;
    }

    .controls-hint {
      text-align: center;
      font-size: 0.64rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="arcade-shell">
    <!-- ÜST MENÜ -->
    <div class="top-nav">
      <a href="./index.html" class="nav-btn">← Ana Sayfa</a>
      <div class="arcade-title">🔥 STREET DOJO ARENA</div>
      <button type="button" class="nav-btn" id="soundBtn">🔊 Ses</button>
    </div>

    <!-- STREET FIGHTER TARZI ARENA -->
    <div class="sf-stage" id="sfStage">
      <!-- DOJO / GÜNBATIMI ARKA PLAN SVG -->
      <svg class="stage-bg-svg" viewBox="0 0 900 420" preserveAspectRatio="none">
        <defs>
          <linearGradient id="sfSky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e1b4b" />
            <stop offset="35%" stop-color="#9a3412" />
            <stop offset="72%" stop-color="#ea580c" />
            <stop offset="100%" stop-color="#facc15" />
          </linearGradient>
          <linearGradient id="dojoFloor" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#78350f" />
            <stop offset="40%" stop-color="#92400e" />
            <stop offset="100%" stop-color="#451a03" />
          </linearGradient>
        </defs>

        <!-- Günbatımı Gökyüzü & Dev Güneş -->
        <rect width="900" height="310" fill="url(#sfSky)" />
        <circle cx="450" cy="185" r="95" fill="#fef08a" opacity="0.88" />
        <circle cx="450" cy="185" r="125" fill="#fde047" opacity="0.22" />

        <!-- Uzak Dağ & Tapınak Pagoda Silüeti -->
        <polygon points="160,295 340,130 520,295" fill="#31102f" opacity="0.7" />
        <polygon points="440,295 640,145 840,295" fill="#1e1b4b" opacity="0.78" />
        <!-- Pagoda Çatıları -->
        <path d="M 380 185 Q 450 172 520 185 L 502 198 L 398 198 Z" fill="#0f172a" />
        <path d="M 395 155 Q 450 144 505 155 L 490 166 L 410 166 Z" fill="#0f172a" />
        <rect x="415" y="166" width="70" height="125" fill="#1e293b" />

        <!-- Dojo Ahşap Sütunları -->
        <rect x="38" y="0" width="34" height="305" fill="#451a03" stroke="#1c0a00" stroke-width="3" />
        <rect x="828" y="0" width="34" height="305" fill="#451a03" stroke="#1c0a00" stroke-width="3" />
        <rect x="0" y="0" width="900" height="22" fill="#290f02" />

        <!-- Sallanan Kırmızı Japon Fenerleri -->
        <g>
          <line x1="130" y1="22" x2="130" y2="54" stroke="#fde047" stroke-width="2" />
          <ellipse cx="130" cy="76" rx="18" ry="24" fill="#dc2626" stroke="#fde047" stroke-width="2" />
          <line x1="770" y1="22" x2="770" y2="54" stroke="#fde047" stroke-width="2" />
          <ellipse cx="770" cy="76" rx="18" ry="24" fill="#dc2626" stroke="#fde047" stroke-width="2" />
        </g>

        <!-- Tezahürat Eden Seyirci Silüetleri -->
        <g fill="#090d16" opacity="0.88">
          <circle cx="115" cy="268" r="14" /><rect x="98" y="282" width="34" height="25" rx="8" />
          <circle cx="165" cy="264" r="15" /><rect x="147" y="279" width="36" height="28" rx="8" />
          <circle cx="220" cy="270" r="13" /><rect x="204" y="283" width="32" height="24" rx="8" />
          <circle cx="680" cy="268" r="14" /><rect x="663" y="282" width="34" height="25" rx="8" />
          <circle cx="735" cy="262" r="15" /><rect x="717" y="277" width="36" height="30" rx="8" />
          <circle cx="790" cy="269" r="13" /><rect x="774" y="282" width="32" height="25" rx="8" />
        </g>

        <!-- Arena Korkuluğu -->
        <rect x="0" y="294" width="900" height="12" fill="#b45309" stroke="#1c0a00" stroke-width="2" />

        <!-- Perspektif Dövüş Zemini -->
        <rect x="0" y="306" width="900" height="114" fill="url(#dojoFloor)" />
        <g stroke="#451a03" stroke-width="2.5" opacity="0.65">
          <line x1="0" y1="335" x2="900" y2="335" />
          <line x1="0" y1="372" x2="900" y2="372" />
          <line x1="150" y1="306" x2="40" y2="420" />
          <line x1="300" y1="306" x2="230" y2="420" />
          <line x1="450" y1="306" x2="450" y2="420" />
          <line x1="600" y1="306" x2="670" y2="420" />
          <line x1="750" y1="306" x2="860" y2="420" />
        </g>
        <line x1="0" y1="306" x2="900" y2="306" stroke="#fde047" stroke-width="2.5" />
      </svg>

      <!-- ARCADE CAN BARLARI -->
      <div class="sf-hud">
        <div class="fighter-hud left">
          <div class="fighter-label">
            <span id="p1Name">SAVAŞÇI</span>
            <span id="p1HpNum">100</span>
          </div>
          <div class="hp-outer left">
            <div class="hp-fill-left" id="p1HpBar"></div>
          </div>
        </div>

        <div class="ko-badge">
          K.O.
          <span class="ko-timer" id="roundTimer">99</span>
        </div>

        <div class="fighter-hud right">
          <div class="fighter-label">
            <span id="p2HpNum">150</span>
            <span>SİGARA CANAVARI</span>
          </div>
          <div class="hp-outer right">
            <div class="hp-fill-right" id="p2HpBar"></div>
          </div>
        </div>
      </div>

      <!-- KOMBO & SÖZ -->
      <div class="combo-banner" id="comboBanner">2 HIT COMBO!</div>
      <div class="arcade-quote" id="arcadeQuote">Vurun kahpeye! İrade ve akıl galip gelecek!</div>

      <!-- KARAKTERLER -->
      <div class="arena-entities" id="arenaEntities">
        <div class="entity-shadow" id="p1Shadow"></div>
        <div class="entity-shadow" id="p2Shadow"></div>

        <!-- OYUNCU 1: SAVAŞÇI -->
        <div class="entity-box" id="p1Box">
          <div class="guard-aura" id="guardAura"></div>
          <svg class="char-svg" viewBox="0 0 360 440">
            <defs>
              <linearGradient id="armorSteel" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7c8591" /><stop offset="50%" stop-color="#4e555e" /><stop offset="100%" stop-color="#2c3138" />
              </linearGradient>
              <linearGradient id="armorOrange" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffa142" /><stop offset="55%" stop-color="#eb6d1a" /><stop offset="100%" stop-color="#a84107" />
              </linearGradient>
              <linearGradient id="swordBlade" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f8fafc" /><stop offset="50%" stop-color="#cbd5e1" /><stop offset="100%" stop-color="#64748b" />
              </linearGradient>
              <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f7b994" /><stop offset="65%" stop-color="#e09168" /><stop offset="100%" stop-color="#b86944" />
              </linearGradient>
              <linearGradient id="hairGold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffe08c" /><stop offset="55%" stop-color="#e8a743" /><stop offset="100%" stop-color="#b57121" />
              </linearGradient>
            </defs>

            <g stroke="#1e242b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
              <!-- Arka Bacak -->
              <g id="w-back-leg">
                <path d="M 110 242 L 154 242 L 138 318 L 106 314 Z" fill="#23272e" />
                <path d="M 102 294 L 132 288 L 144 312 L 128 334 L 102 324 Z" fill="url(#armorSteel)" />
                <path d="M 102 324 L 136 328 L 126 396 L 126 424 L 78 426 L 78 414 L 100 392 Z" fill="#3a2116" />
              </g>
              <!-- Etek Zırhı -->
              <path d="M 134 228 L 178 228 L 184 326 L 166 312 L 154 332 L 142 314 L 130 342 Z" fill="url(#armorOrange)" />
              <!-- Ön Tekme Bacağı (Kalça: 186, 246) -->
              <g transform="translate(186, 246)">
                <g id="w-kick-pivot">
                  <g transform="translate(-186, -246)">
                    <path d="M 168 242 L 204 242 L 214 316 L 184 318 Z" fill="#23272e" />
                    <path d="M 180 296 L 204 290 L 216 312 L 204 334 L 182 324 Z" fill="url(#armorSteel)" />
                    <path d="M 182 324 L 214 328 L 222 396 L 246 416 L 246 426 L 198 424 L 194 374 Z" fill="#3a2116" />
                  </g>
                </g>
              </g>

              <!-- Üst Gövde (Bel: 156, 222) -->
              <g transform="translate(156, 222)">
                <g id="w-torso-pivot">
                  <g transform="translate(-156, -222)">
                    <!-- Ön Kol / Yumruk & Kalkan (Omuz: 214, 148) -->
                    <g transform="translate(214, 148)">

  <script>
    /* ==========================================================
       1. PROFİL & SES MOTORU
       ========================================================== */
    const activeProfile = localStorage.getItem("oksijen_active_profile_v1") || "SAVAŞÇI";
    document.getElementById("p1Name").textContent = activeProfile.toUpperCase();

    let soundEnabled = localStorage.getItem("oksijen_sound_enabled") !== "false";
    let audioCtx = null;

    function getCtx() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function playFx(type) {
      if (!soundEnabled) return;
      const ctx = getCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      if (type === "punch") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.12);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      } else if (type === "kick") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(175, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.25);
        gain.gain.setValueAtTime(0.58, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      } else if (type === "head") {
        osc.type = "square";
        osc.frequency.setValueAtTime(135, now);
        osc.frequency.exponentialRampToValueAtTime(34, now + 0.22);
        gain.gain.setValueAtTime(0.42, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.23);
      } else if (type === "sword") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(1450, now);
        osc.frequency.exponentialRampToValueAtTime(190, now + 0.34);
        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      } else if (type === "block") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(980, now);
        osc.frequency.exponentialRampToValueAtTime(640, now + 0.18);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
      } else {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.2);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.21);
      }

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.36);
    }

    function speakTr(text, isWarrior = true) {
      if (!soundEnabled || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/phh/gi, "pıhh").replace(/mnskinm/gi, "mınısikinim"));
        u.lang = "tr-TR";
        u.pitch = isWarrior ? 0.8 : 1.45;
        u.rate = isWarrior ? 1.05 : 1.22;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    const soundBtn = document.getElementById("soundBtn");
    soundBtn.textContent = soundEnabled ? "🔊 Ses" : "🔇 Sessiz";
    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem("oksijen_sound_enabled", String(soundEnabled));
      soundBtn.textContent = soundEnabled ? "🔊 Ses" : "🔇 Sessiz";
    });

    /* ==========================================================
       2. DÖVÜŞ FİZİĞİ VE DURUM YÖNETİMİ
       ========================================================== */
    const sfStage = document.getElementById("sfStage");
    const arenaEntities = document.getElementById("arenaEntities");
    const p1Box = document.getElementById("p1Box");
    const p2Box = document.getElementById("p2Box");
    const p1Shadow = document.getElementById("p1Shadow");
    const p2Shadow = document.getElementById("p2Shadow");
    const guardAura = document.getElementById("guardAura");

    const wKickPivot = document.getElementById("w-kick-pivot");
    const wTorsoPivot = document.getElementById("w-torso-pivot");
    const wPunchPivot = document.getElementById("w-punch-pivot");
    const wHeadPivot = document.getElementById("w-head-pivot");
    const wSwordPivot = document.getElementById("w-sword-pivot");

    const SKILLS = {
      punch: { dmg: 8,  range: 145, cd: 380,  quote: "Bana açık verme!" },
      kick:  { dmg: 14, range: 175, cd: 650,  quote: "Gerçek iradeye tanıklık et!" },
      head:  { dmg: 18, range: 145, cd: 950,  quote: "Zihnin çelik gibi!" },
      sword: { dmg: 26, range: 195, cd: 1350, quote: "Noxus galip gelecek!" }
    };

    const state = {
      p1Hp: 100, p1Max: 100,
      p2Hp: 150, p2Max: 150,
      p1X: 70,
      p2X: 380,
      p1Y: 0,
      p1Vy: 0,
      isJumping: false,
      isCrouching: false,
      isAttacking: false,
      p2StunUntil: 0,
      p2NextAiTime: 0,
      combo: 0,
      lastHitTime: 0,
      roundOver: false,
      timer: 99,
      keys: { left: false, right: false, up: false, down: false },
      cooldowns: { punch: 0, kick: 0, head: 0, sword: 0 },
      projectiles: []
    };

    function resetRound() {
      const stageW = sfStage.clientWidth || 640;
      state.p1Hp = state.p1Max;
      state.p2Hp = state.p2Max;
      state.p1X = Math.round(stageW * 0.12);
      state.p2X = Math.round(stageW * 0.68);
      state.p1Y = 0;
      state.p1Vy = 0;
      state.isJumping = false;
      state.isCrouching = false;
      state.isAttacking = false;
      state.p2StunUntil = 0;
      state.p2NextAiTime = performance.now() + 900;
      state.combo = 0;
      state.roundOver = false;
      state.timer = 99;
      state.projectiles.forEach(p => p.el.remove());
      state.projectiles = [];

      document.getElementById("roundOverlay").classList.remove("visible");
      updateHud();
      showQuote("Vurun kahpeye! İrade ve akıl galip gelecek!");
      speakTr("Vurun kahpeye!", true);
    }

    function updateHud() {
      const p1Pct = Math.max(0, Math.round((state.p1Hp / state.p1Max) * 100));
      const p2Pct = Math.max(0, Math.round((state.p2Hp / state.p2Max) * 100));

      const p1Bar = document.getElementById("p1HpBar");
      const p2Bar = document.getElementById("p2HpBar");
      p1Bar.style.width = `${p1Pct}%`;
      p2Bar.style.width = `${p2Pct}%`;
      p1Bar.classList.toggle("danger", p1Pct <= 25);
      p2Bar.classList.toggle("danger", p2Pct <= 25);

      document.getElementById("p1HpNum").textContent = Math.max(0, state.p1Hp);
      document.getElementById("p2HpNum").textContent = Math.max(0, state.p2Hp);
    }

    let quoteTimer = null;
    function showQuote(txt) {
      const el = document.getElementById("arcadeQuote");
      el.textContent = txt;
      el.classList.add("show");
      clearTimeout(quoteTimer);
      quoteTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function spawnSpark(x, y, text, cls = "") {
      const el = document.createElement("div");
      el.className = `hit-spark ${cls}`;
      el.style.left = `${x}px`;
      el.style.bottom = `${y}px`;
      el.textContent = text;
      arenaEntities.appendChild(el);
      setTimeout(() => el.remove(), 660);
    }

    function screenShake() {
      sfStage.animate([
        { transform: "translate(0, 0)" },
        { transform: "translate(-6px, 4px)" },
        { transform: "translate(6px, -4px)" },
        { transform: "translate(0, 0)" }
      ], { duration: 220 });
    }

    function endRound(winnerText) {
      if (state.roundOver) return;
      state.roundOver = true;
      document.getElementById("roundResultText").textContent = winnerText;
      document.getElementById("roundOverlay").classList.add("visible");
    }

    /* ==========================================================
       3. 4 SKILL SALDIRISI (YUMRUK, TEKME, KAFA, KILIÇ)
       ========================================================== */
    function useSkill(skillName) {
      if (state.roundOver || state.isAttacking) return;
      const now = performance.now();
      const cfg = SKILLS[skillName];
      if (!cfg || now < state.cooldowns[skillName]) return;

      state.cooldowns[skillName] = now + cfg.cd;
      state.isAttacking = true;
      setTimeout(() => { state.isAttacking = false; }, 250);

      // Cooldown görsel barı
      const mask = document.getElementById(`cd-${skillName}`);
      if (mask) {
        mask.animate([
          { transform: "scaleY(1)" },
          { transform: "scaleY(0)" }
        ], { duration: cfg.cd, easing: "linear" });
      }

      playFx(skillName);

      // Karakter Animasyonu
      if (skillName === "punch") {
        wTorsoPivot.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(14deg)" }, { transform: "rotate(0deg)" }], { duration: 220 });
        wPunchPivot.animate([{ transform: "translateX(0px)" }, { transform: "translateX(44px)" }, { transform: "translateX(0px)" }], { duration: 220 });
      } else if (skillName === "kick") {
        // SPARTAKÜS TEKMESİ
        wTorsoPivot.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-18deg)" }, { transform: "rotate(0deg)" }], { duration: 340 });
        wKickPivot.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-82deg)" }, { transform: "rotate(0deg)" }], { duration: 340 });
      } else if (skillName === "head") {
        // KAFA DARBESİ
        p1Box.animate([{ transform: "translateX(0px)" }, { transform: "translateX(26px)" }, { transform: "translateX(0px)" }], { duration: 280 });
        wTorsoPivot.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(26deg)" }, { transform: "rotate(0deg)" }], { duration: 280 });
        wHeadPivot.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(18deg)" }, { transform: "rotate(0deg)" }], { duration: 280 });
      } else if (skillName === "sword") {
        // KILIÇ FATAL
        wTorsoPivot.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-15deg)" }, { transform: "rotate(22deg)" }, { transform: "rotate(0deg)" }], { duration: 380 });
        wSwordPivot.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(-68deg)" }, { transform: "rotate(55deg)" }, { transform: "rotate(0deg)" }], { duration: 380 });
      }

      // Mesafe ve İsabet Kontrolü
      const dist = Math.abs((state.p2X) - (state.p1X + 45));
      if (dist <= cfg.range) {
        state.p2Hp = Math.max(0, state.p2Hp - cfg.dmg);

        // Kombo Sayacı
        if (now - state.lastHitTime < 1400) {
          state.combo++;
        } else {
          state.combo = 1;
        }
        state.lastHitTime = now;

        const cb = document.getElementById("comboBanner");
        if (state.combo >= 2) {
          cb.textContent = `${state.combo} HIT COMBO!`;
          cb.classList.add("show");
        } else {
          cb.classList.remove("show");
        }

        // Geri savurma & sersemletme
        const stageW = sfStage.clientWidth || 640;
        const knockback = skillName === "kick" ? 42 : (skillName === "sword" ? 32 : 18);
        state.p2X = Math.min(stageW - 145, state.p2X + knockback);

        if (skillName === "head") {
          state.p2StunUntil = now + 950;
          spawnSpark(state.p2X + 65, 165, `🤕 KAFA -${cfg.dmg} (SERSEM!)`);
        } else if (skillName === "sword") {
          screenShake();
          spawnSpark(state.p2X + 65, 155, `⚔️ FATAL -${cfg.dmg}`, "fatal");
          showQuote(cfg.quote);
          speakTr(cfg.quote, true);
        } else if (skillName === "kick") {
          spawnSpark(state.p2X + 65, 130, `🦵 SPARTAKÜS -${cfg.dmg}`);
        } else {
          spawnSpark(state.p2X + 65, 145, `👊 -${cfg.dmg}`);
        }

        p2Box.animate([
          { filter: "brightness(1)", transform: "rotate(0deg)" },
          { filter: "brightness(2)", transform: "rotate(8deg)" },
          { filter: "brightness(1)", transform: "rotate(0deg)" }
        ], { duration: 220 });

        updateHud();

        if (state.p2Hp <= 0) {
          speakTr("Gücünü kanıtladın!", true);
          endRound("🏆 K.O. — SAVAŞÇI KAZANDI!");
        }
      }
    }

    /* ==========================================================
       4. CANAVAR YAPAY ZEKASI (SALDIRILAR & DUMAN TOPU)
       ========================================================== */
    function spawnSmokeProjectile() {
      const el = document.createElement("div");
      el.className = "smoke-projectile";
      const isHigh = Math.random() > 0.45; // Yüksek atış eğilerek, alçak atış zıplayarak geçilir
      const bottomPx = isHigh ? 128 : 42;
      const startX = state.p2X + 10;

      el.style.left = `${startX}px`;
      el.style.bottom = `${bottomPx}px`;
      arenaEntities.appendChild(el);

      state.projectiles.push({ el, x: startX, bottom: bottomPx, isHigh, vx: -5.4 });
    }

    function damagePlayer(rawDmg, label) {
      const isBlocking = state.keys.left && !state.isAttacking && !state.isJumping;
      if (isBlocking) {
        const reduced = Math.max(2, Math.round(rawDmg * 0.25));
        state.p1Hp = Math.max(0, state.p1Hp - reduced);
        playFx("block");
        spawnSpark(state.p1X + 75, 130, `🛡️ BLOK (-${reduced})`, "block");
      } else {
        state.p1Hp = Math.max(0, state.p1Hp - rawDmg);
        playFx("monster");
        spawnSpark(state.p1X + 65, 135, `${label} -${rawDmg}`);
        p1Box.animate([{ filter: "brightness(1)" }, { filter: "brightness(1.8)" }, { filter: "brightness(1)" }], { duration: 200 });
      }
      updateHud();
      if (state.p1Hp <= 0) {
        endRound("💀 K.O. — SİGARA CANAVARI KAZANDI");
      }
    }

    /* ==========================================================
       5. ANA OYUN DÖNGÜSÜ (60 FPS)
       ========================================================== */
    let lastFrame = performance.now();
    let timerAccum = 0;

    function gameLoop(now) {
      const dt = Math.min(40, now - lastFrame);
      lastFrame = now;

      if (!state.roundOver) {
        const stageW = sfStage.clientWidth || 640;

        // Zamanlayıcı
        timerAccum += dt;
        if (timerAccum >= 1000) {
          timerAccum -= 1000;
          state.timer = Math.max(0, state.timer - 1);
          document.getElementById("roundTimer").textContent = String(state.timer).padStart(2, "0");
          if (state.timer === 0) {
            endRound(state.p1Hp >= state.p2Hp ? "⏱️ SÜRE BİTTİ — KAZANDIN!" : "⏱️ SÜRE BİTTİ — KAYBETTİN");
          }
        }

        // Oyuncu 1 Hareket
        const speed = 4.2;
        if (state.keys.left)  state.p1X = Math.max(10, state.p1X - speed);
        if (state.keys.right) state.p1X = Math.min(state.p2X - 85, state.p1X + speed);

        if (state.keys.up && !state.isJumping) {
          state.isJumping = true;
          state.p1Vy = 12.5;
        }

        if (state.isJumping) {
          state.p1Y += state.p1Vy;
          state.p1Vy -= 0.68;
          if (state.p1Y <= 0) {
            state.p1Y = 0;
            state.p1Vy = 0;
            state.isJumping = false;
          }
        }

        state.isCrouching = state.keys.down && !state.isJumping;
        guardAura.classList.toggle("active", state.keys.left && !state.isAttacking && !state.isJumping);

        // Oyuncu 2 (Canavar) Yapay Zekası
        if (now > state.p2StunUntil) {
          const gap = state.p2X - state.p1X;
          if (gap > 140) {
            state.p2X -= 1.85;
          }
          if (now > state.p2NextAiTime) {
            if (gap <= 155) {
              // Yakın Pençe Saldırısı
              p2Box.animate([
                { transform: "translateX(0px)" },
                { transform: "translateX(-34px)" },
                { transform: "translateX(0px)" }
              ], { duration: 300 });
              setTimeout(() => {
                if (!state.roundOver && Math.abs(state.p2X - state.p1X) <= 165) {
                  damagePlayer(12, "🐾 PENÇE");
                }
              }, 140);
              state.p2NextAiTime = now + 1350;
            } else {
              // Uzaktan Duman Topu
              spawnSmokeProjectile();
              state.p2NextAiTime = now + 1750;
            }
          }
        }

        // Duman Mermileri Güncelleme
        for (let i = state.projectiles.length - 1; i >= 0; i--) {
          const proj = state.projectiles[i];
          proj.x += proj.vx;
          proj.el.style.left = `${proj.x}px`;

          const hitX = Math.abs((proj.x + 17) - (state.p1X + 68)) < 36;
          const dodgedHigh = proj.isHigh && state.isCrouching;
          const dodgedLow = !proj.isHigh && state.p1Y > 55;

          if (hitX && !dodgedHigh && !dodgedLow) {
            damagePlayer(10, "💨 DUMAN");
            proj.el.remove();
            state.projectiles.splice(i, 1);
          } else if (proj.x < -40) {
            proj.el.remove();
            state.projectiles.splice(i, 1);
          }
        }

        // DOM Pozisyonlarını Uygula
        const scaleY = state.isCrouching ? 0.76 : 1;
        p1Box.style.left = `${state.p1X}px`;
        p1Box.style.transform = `translateY(${-state.p1Y}px) scaleY(${scaleY})`;
        p1Shadow.style.left = `${state.p1X + 72}px`;

        p2Box.style.left = `${state.p2X}px`;
        p2Shadow.style.left = `${state.p2X + 78}px`;
      }

      requestAnimationFrame(gameLoop);
    }

    /* ==========================================================
       6. DOKUNMATİK & KLAVYE BAĞLANTILARI
       ========================================================== */
    document.querySelectorAll(".dpad-btn").forEach(btn => {
      const dir = btn.dataset.dir;
      const press = (e) => {
        e.preventDefault();
        state.keys[dir] = true;
        btn.classList.add("pressed");
      };
      const release = (e) => {
        e.preventDefault();
        state.keys[dir] = false;
        btn.classList.remove("pressed");
      };
      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointerleave", release);
      btn.addEventListener("pointercancel", release);
    });

    document.querySelectorAll(".skill-btn").forEach(btn => {
      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        useSkill(btn.dataset.skill);
      });
    });

    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === "arrowleft" || k === "a")  state.keys.left = true;
      if (k === "arrowright" || k === "d") state.keys.right = true;
      if (k === "arrowup" || k === "w")    state.keys.up = true;
      if (k === "arrowdown" || k === "s")  state.keys.down = true;

      if (k === "1" || k === "z") useSkill("punch");
      if (k === "2" || k === "x") useSkill("kick");
      if (k === "3" || k === "c") useSkill("head");
      if (k === "4" || k === "v") useSkill("sword");
    });

    window.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (k === "arrowleft" || k === "a")  state.keys.left = false;
      if (k === "arrowright" || k === "d") state.keys.right = false;
      if (k === "arrowup" || k === "w")    state.keys.up = false;
      if (k === "arrowdown" || k === "s")  state.keys.down = false;
    });

    document.getElementById("rematchBtn").addEventListener("click", resetRound);

    resetRound();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
